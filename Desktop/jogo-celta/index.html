<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Corrida - Celta vs Chevette</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .menu {
            text-align: center;
            background: #16213e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .botoes-carros {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #ff6b81;
        }
        canvas {
            border: 3px solid #e94560;
            background-color: #0f0f1a;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            border-radius: 8px;
            display: block;
        }
        #painelJogo {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .controles-jogo {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- MENU DE SELEÇÃO DE CARRO -->
    <div id="menuSelecao" class="menu">
        <h1>Escolha o seu Carro</h1>
        <p>Selecione com qual veículo quer correr na pista:</p>
        <div class="botoes-carros">
            <button onclick="iniciarJogo('celta')">🚗 Celta 2003</button>
            <button onclick="iniciarJogo('chevette')">🏎️ Chevette</button>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div id="painelJogo">
        <h1>Modo Corrida Noturna</h1>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="controles-jogo">
            <button id="btnNitro">⚡ NITRO</button>
            <button onclick="voltarMenu()" style="background-color: #4e4e6a; margin-left: 10px;">🔄 Trocar Carro</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
